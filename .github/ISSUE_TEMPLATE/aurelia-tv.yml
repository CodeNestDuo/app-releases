
name: Aurelia TV Bug Report
description: Report a bug in Aurelia TV for Android TV and Google TV.
title: "[Aurelia TV]: "
labels:
  - bug
  - app:aurelia-tv
  - needs-triage

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping us improve Aurelia TV!
        Please provide as much detail as possible.
        Do not include passwords, access tokens or private server credentials.

  - type: input
    id: app_version
    attributes:
      label: Aurelia TV version
      placeholder: e.g. 1.0.2
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Android TV device
      description: Include the manufacturer and model.
      placeholder: e.g. Xiaomi TV Box, Sony Bravia, Mi TV
    validations:
      required: true

  - type: input
    id: android_version
    attributes:
      label: Android TV version
      placeholder: e.g. Android TV 12
    validations:
      required: true

  - type: input
    id: jellyfin_version
    attributes:
      label: Jellyfin server version
      placeholder: e.g. 10.10.7
    validations:
      required: false

  - type: dropdown
    id: playback_engine
    attributes:
      label: Playback engine
      description: Which playback engine were you using?
      options:
        - Media3 ExoPlayer
        - libmpv
        - Jellyfin MDK
        - Not playback-related
        - Not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: Describe what happened.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open...
        2. Navigate to...
        3. Select...
        4. Observe the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: What did you expect to happen?
    validations:
      required: false

  - type: textarea
    id: attachments
    attributes:
      label: Logs, screenshots or videos
      description: Attach relevant logs or media. Remove private information first.
    validations:
      required: false
